# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gerrit-vote"
dynamic = ["version"]
description = "Cast label votes (Code-Review by default) on Gerrit changes via REST — voting only, never submits."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Junbo Zheng" }]
keywords = ["gerrit", "code-review", "vote", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
]
# tomllib is stdlib on 3.11+; fall back to the tomli backport on 3.10.
# questionary drives the arrow-key confirmation menu (+2 / +1 / quit).
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/Junbo-Zheng/gerrit-vote"
Repository = "https://github.com/Junbo-Zheng/gerrit-vote"
Issues = "https://github.com/Junbo-Zheng/gerrit-vote/issues"

[project.scripts]
gerrit-vote = "gerrit_vote.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.hatch.version]
path = "src/gerrit_vote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gerrit_vote"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# flake8-equivalent defaults (E + F + W) plus isort (I) — ruff replaces both
# flake8 (lint) and black (format). `ruff format` handles style; these rules
# catch what the formatter cannot (unused imports, undefined names, import
# ordering, real logic errors).
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Import the package straight from src/ so `pytest` runs against the working
# tree with no build/install step — this always shadows any site-packages copy.
pythonpath = ["src"]
