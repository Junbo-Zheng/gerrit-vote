# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check src tests main.py

      - name: Format (ruff format --check)
        run: ruff format --check src tests main.py

      - name: Test
        run: pytest -q

  # Verify the *built* package: pyproject sets pythonpath = ["src"], so the test
  # job above imports from src/ and never exercises the wheel. This job builds
  # the wheel, installs it clean, and runs the suite with `-o pythonpath=` to
  # clear the src shortcut — so the installed package is imported and packaging
  # bugs (a module missing from the wheel, a data file left out) fail CI.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          pip install pytest

      - name: Test against the installed package
        run: pytest -q -o pythonpath=
